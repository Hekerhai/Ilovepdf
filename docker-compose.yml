name: folio

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg://folio:${POSTGRES_PASSWORD:-folio}@postgres:5432/folio
    REDIS_URL: redis://redis:6379/0
    # Files live on a shared volume by default; set STORAGE_BACKEND=s3 and S3_* in .env for S3, R2 or B2.
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    GOTENBERG_URL: http://gotenberg:3000
    CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost}"]'
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
  volumes:
    - work:/data/work
    - files:/data/files
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-Folio}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL:-http://localhost}
    restart: unless-stopped
    environment:
      API_URL: http://api:8000

  api:
    <<: *backend

  worker:
    <<: *backend
    command: ["rq", "worker", "folio", "--url", "redis://redis:6379/0", "--with-scheduler"]
    healthcheck: { disable: true }
    deploy:
      replicas: ${WORKERS:-2}

  janitor:
    <<: *backend
    command: ["python", "-m", "app.janitor"]
    healthcheck: { disable: true }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-folio}
      POSTGRES_DB: folio
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=600s", "--libreoffice-restart-after=50"]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["8025:8025"]

volumes:
  postgres:
  files:
  work:
  caddy_data:
